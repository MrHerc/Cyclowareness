name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # `-q` alone puts the reason for a failure only in the raw job log, which
      # needs repository admin rights to download. So a red build says "exit
      # code 1" to everyone who is not an admin, and the person best placed to
      # fix it has to ask someone else what broke. Echoing the failing test ids
      # and the traceback as `::error::` puts them in the run's annotations,
      # which are visible to anyone who can see the repository.
      - name: Run tests
        run: |
          set +e
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' pytest-output.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
            # The last block holds the assertion that actually fired.
            echo "::group::tail of pytest output"
            tail -60 pytest-output.txt
            echo "::endgroup::"
            tail -25 pytest-output.txt | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit "$code"

      # The demo build and the production build are different API surfaces.
      # The suite runs as APP_ENV=demo, so assert the production gating here.
      - name: Production build refuses demo-grade config
        run: |
          if APP_ENV=production SECRET_KEY=short DATABASE_URL=sqlite:///./x.db \
             python -c "import app.main" 2>/dev/null; then
            echo "::error::production booted with demo-grade config"; exit 1
          fi
          echo "refused as expected"
      - name: Demo-only routes absent from production surface
        env:
          APP_ENV: production
          SECRET_KEY: ci-placeholder-key-at-least-32-bytes-long!!
          DATABASE_URL: postgresql+psycopg://u:p@localhost:5432/c
          CORS_ORIGINS: https://app.example.com
          # A valid production config now also requires the real sandbox
          # analyzer (the mock fabricates findings). Supplying it lets the app
          # boot so the route surface can be inspected.
          SANDBOX_ANALYZER: real
          REAL_ANALYZER_API_KEY: ci-placeholder-not-used-at-import
        run: |
          python - <<'PY'
          from app.main import app
          paths = set(app.openapi()["paths"])
          bad = [p for p in paths if "auto-outcomes" in p or "reset-demo" in p]
          assert not bad, f"demo-only routes exposed in production: {bad}"
          assert "/api/loop-runs" in paths, "core routes missing"
          print(f"production surface clean ({len(paths)} paths)")
          PY

  # SQLite forgives things PostgreSQL does not: it has no real ALTER (Alembic
  # rebuilds the table instead), it accepts a NULL into a NOT NULL column added
  # without a default, and its JSON is text. Every one of those differences is a
  # migration that passes locally and fails on the database production actually
  # runs. So the chain is proved where it will be used.
  migrations:
    name: Migrations — PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cyclo
          POSTGRES_PASSWORD: cyclo
          POSTGRES_DB: cyclowareness
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: demo
      SECRET_KEY: ci-placeholder-key-at-least-32-bytes-long!!
      DATABASE_URL: postgresql+psycopg://cyclo:cyclo@localhost:5432/cyclowareness
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Same reason as the pytest step: the raw job log needs admin rights to
      # download, so a failure here must put its own error into the annotations.
      - name: Chain runs clean on an empty database
        run: |
          set +e
          alembic upgrade head 2>&1 | tee up.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            grep -iE 'error|exception|psycopg|sqlalchemy' up.txt | tail -12 | while IFS= read -r l; do
              echo "::error::$l"
            done
          fi
          exit "$code"

      # The gate. `alembic check` compares models.py against the migrated
      # schema, so a model changed without a revision fails the build instead of
      # reaching a customer as a column that create_all() silently never added.
      - name: Models and migrations agree
        run: |
          if ! alembic check 2>&1 | tee check.txt; then
            grep -E 'Detected|added|removed' check.txt | while IFS= read -r l; do
              echo "::error::$l"
            done
            echo "::error::models.py changed without a migration — run: alembic revision --autogenerate -m '<what changed>'"
            exit 1
          fi

      - name: Downgrade to base and back up again
        run: |
          set +e
          { alembic downgrade base && alembic upgrade head; } 2>&1 | tee rt.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            grep -iE 'error|exception|psycopg|sqlalchemy' rt.txt | tail -12 | while IFS= read -r l; do
              echo "::error::$l"
            done
          fi
          exit "$code"

      # An operator upgrading an existing deployment walks this path, and no
      # fresh-database test ever touches it.
      - name: A pre-Alembic database is adopted, not bricked
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from alembic import command
          from app.database import alembic_config, engine, run_migrations, _legacy_stamp_target

          # Rewind to the pre-integration release, then erase the version table
          # so the database looks exactly like one create_all() built.
          cfg = alembic_config()
          with engine.begin() as c:
              cfg.attributes["connection"] = c
              command.downgrade(cfg, "0001_baseline")
          with engine.begin() as c:
              c.execute(text("DROP TABLE alembic_version"))

          with engine.connect() as c:
              target = _legacy_stamp_target(c)
          assert target == "0001_baseline", f"ladder said {target!r}"

          run_migrations()

          with engine.connect() as c:
              cols = {r[0] for r in c.execute(text(
                  "SELECT column_name FROM information_schema.columns "
                  "WHERE table_name = 'sandbox_jobs'"))}
          missing = {"tenant_id", "impact", "verdict", "mitre", "dynamic"} - cols
          assert not missing, f"adoption left columns missing: {missing}"
          print("pre-Alembic database adopted and upgraded on PostgreSQL")
          PY

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check & build
        run: npm run build
      - name: Internal links resolve
        run: npm run check:links
      - name: Message keys are rendered and complete
        run: npm run check:i18n
      # `check:i18n` proves the CATALOGUE is sound — no orphan keys, both
      # locales complete. It says nothing about text that never became a key,
      # which is the other half and the bigger one: 130 hardcoded labels
      # (`label="Password"`, on the sign-in screen) passed it for months.
      #
      # `find-untranslated.py` is what finds those, and it is only worth having
      # if it works. It spent that whole time pointed at an absolute path on one
      # Windows machine, so it crashed everywhere else and nobody noticed. The
      # self-test asserts it still finds two known-untranslated strings and
      # still ignores two known-fine ones — cheap, and it fails loudly when the
      # scanner rots again.
      #
      # The scan itself is NOT a gate: there is a real backlog of prose behind
      # it (`npm run find:untranslated` prints it, `docs/pending-translations.json`
      # holds the Azerbaijani already written for the parked keys). Gating on
      # zero today would just mean disabling the step.
      - name: The untranslated-string scanner still works
        run: npm run check:scanner
